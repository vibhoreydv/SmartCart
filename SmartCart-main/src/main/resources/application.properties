spring.application.name=SmartCart

server.port=8082
spring.datasource.url=jdbc:mysql://localhost:3306/smartcart
spring.datasource.username=root
spring.datasource.password=Windows10@#

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true


# IMPORTANT: always run schema.sql + data.sql, even for MySQL
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
# This will make db in memory
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
